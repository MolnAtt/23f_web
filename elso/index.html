<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Első doksi</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <h1>Első doksi</h1>
    </header>
    <main>
        <form action="/login/" method="post">
            <h2>Bejelentkezés</h2>
            <label for="username">Email:</label>
            <input type="email" id="username" class="beviteli_mezo" name="username" required>
            <br>
            <label for="password">Jelszó:</label>
            <input type="password" id="password" class="beviteli_mezo" name="password" required>
            <br>
            <button type="button">Bejelentkezés</button>
        </form>
    </main>
    <footer>
        <address>
            <p>Kapcsolat: <a href="mailto:info@example.com">info@example.com</a></p>
        </address>
    </footer>
</body>
</html>
